apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "container-series-app.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "container-series-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Testing connection to {{ include "container-series-app.fullname" . }}..."
          wget -O- http://{{ include "container-series-app.fullname" . }}:{{ .Values.service.port }}/health
          echo ""
          echo "Health check passed!"
