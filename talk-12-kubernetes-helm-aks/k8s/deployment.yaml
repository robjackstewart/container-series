apiVersion: apps/v1
kind: Deployment
metadata:
  name: talk-12-api
  namespace: container-series
  annotations:
    container-series.io/init-pattern: "Uses an init container to prepare the pod before the Ktor API starts"
    container-series.io/sidecar-pattern: "Uses a sidecar container to tail the shared application log"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: talk-12-api
  template:
    metadata:
      labels:
        app: talk-12-api
    spec:
      initContainers:
        - name: init-app
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /var/log/app && touch /var/log/app/application.log && chmod -R 0777 /var/log/app && echo 'Initialization complete'"]
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
      containers:
        - name: talk-12-api
          image: myacr.azurecr.io/talk-12:latest
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - java -jar /app/app.jar 2>&1 | tee -a /var/log/app/application.log
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: talk-12-config
            - secretRef:
                name: talk-12-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
        - name: log-forwarder
          image: busybox:1.36
          command: ["sh", "-c", "touch /var/log/app/application.log && tail -F /var/log/app/application.log"]
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
      volumes:
        - name: app-logs
          emptyDir: {}
