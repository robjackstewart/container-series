# Copy this file to the repository root .github/workflows/ directory to activate it in GitHub.
name: talk-11-multi-arch

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: container-series/talk-11

jobs:
  multi-arch-build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name ${{ secrets.ACR_NAME }}
      - uses: docker/build-push-action@v5
        with:
          context: ./talk-11-cicd-for-containers
          file: ./talk-11-cicd-for-containers/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          # Behind Netskope, provide the corporate CA as a repository secret named NETSKOPE_CERT.
          # The cert is not stored in any image layer — it is mounted as a BuildKit secret per RUN.
          secrets: |
            netskope_cert=${{ secrets.NETSKOPE_CERT }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: true
          sbom: true
