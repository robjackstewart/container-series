# Copy this file to the repository root .github/workflows/ directory to activate it in GitHub.
name: talk-11-ci

on:
  pull_request:
    paths:
      - 'talk-11-cicd-for-containers/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talk-11-cicd-for-containers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r src/requirements.txt pytest pytest-asyncio httpx
      - run: pytest tests/ -v

  build-and-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./talk-11-cicd-for-containers
          file: ./talk-11-cicd-for-containers/Dockerfile
          push: false
          load: true
          tags: myapp:${{ github.sha }}
          # Behind Netskope, provide the corporate CA as a repository secret named NETSKOPE_CERT.
          # The cert is not stored in any image layer — it is mounted as a BuildKit secret per RUN.
          secrets: |
            netskope_cert=${{ secrets.NETSKOPE_CERT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:${{ github.sha }}
          exit-code: '1'
          severity: CRITICAL
