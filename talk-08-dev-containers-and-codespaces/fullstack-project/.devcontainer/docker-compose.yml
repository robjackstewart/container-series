services:
  api:
    build:
      context: ../api
      secrets:
        - netskope_cert
    volumes: ["../..:/workspace:cached"]
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://devuser:devpass@db:5432/devdb
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    volumes: ["devdata:/var/lib/postgresql/data", "../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
volumes:
  devdata:

# Default to an empty placeholder so builds work without a cert.
# Override with: NETSKOPE_CERT=../api/certs/netskope.crt docker compose build
secrets:
  netskope_cert:
    file: ${NETSKOPE_CERT:-../api/certs/.gitkeep}
